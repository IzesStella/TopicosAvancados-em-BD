version: "3.8"

services:
  mongodb:
    image: mongo:7
    container_name: mongodb-atividade4
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  app:
    build: ./app
    container_name: app-atividade4
    depends_on:
      - mongodb
    environment:
      - MONGO_URI=mongodb://mongodb:27017
    volumes:
      - .:/app
    command: tail -f /dev/null

volumes:
  mongo_data:
